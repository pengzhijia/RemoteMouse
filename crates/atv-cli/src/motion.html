<!doctype html><html lang="zh"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>RemoteMouse 运动控制</title><style>body{background:#111;color:#eee;font:17px system-ui;padding:20px}button{font:inherit;padding:14px;margin:6px;border:0;border-radius:14px}#pad{height:45vh;background:#252525;border-radius:26px;touch-action:none;margin-top:20px;display:grid;place-items:center}p{line-height:1.6}</style><h2>RemoteMouse</h2><p id="status">在电脑选择陀螺仪模式，然后开启运动控制。</p><button id="start">开启陀螺仪</button><button id="pause">暂停 / 继续</button><p>转动手机移动光标。单指轻点左键、双指轻点右键、双指移动滚动、三指轻点执行已配置动作，三指滑动按住左键拖动物体，抬起释放，四指滑动切桌面或打开调度中心，捏合通过缩放快捷键执行。使用控制中心遥控器时，运动采样可能暂停；恢复此页会重新建立计时。</p><p>灵敏度 <input id="gain" type="range" min="2" max="30" value="12"> 横向轴 <select id="horizontal"><option>gamma</option><option>alpha</option><option>beta</option></select> 纵向轴 <select id="vertical"><option>alpha</option><option>beta</option><option>gamma</option></select></p><div id="pad">触摸操作区</div><script>
const token=new URLSearchParams(location.search).get('token');history.replaceState(null,'','/');let active=false,last=0,busy=false,pending=null,count=0,start=null,prev=null,moved=false,spread=0;const label=document.getElementById('status');
let requests=Promise.resolve();
function send(v){requests=requests.then(()=>transmit(v));return requests;}
async function transmit(v){try{const r=await fetch('/input',{method:'POST',headers:{'X-Motion-Token':token,'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok)throw Error(r.status);label.textContent=active?'陀螺仪运行中':'运动已暂停';}catch(e){active=false;label.textContent='连接失败：'+e.message;}}
function flush(){if(busy||!pending)return;busy=true;const v=pending;pending=null;send(v).finally(()=>{busy=false;flush()});}
document.getElementById('start').onclick=async()=>{try{if(!window.isSecureContext||typeof DeviceMotionEvent==='undefined')throw Error('需要支持运动传感器的 HTTPS 页面');if(DeviceMotionEvent.requestPermission&&await DeviceMotionEvent.requestPermission()!=='granted')throw Error('运动权限未开启');active=true;last=0;label.textContent='已开启，请转动手机';setTimeout(()=>{if(active&&!last)label.textContent='未收到运动数据，请检查证书信任和运动权限。';},3000);}catch(e){label.textContent=e.message;}};
document.getElementById('pause').onclick=()=>{active=!active;last=0;pending=null;label.textContent=active?'继续运动控制':'运动已暂停';};
addEventListener('devicemotion',e=>{if(!active||document.hidden)return;const r=e.rotationRate;if(!r)return;const now=performance.now(),dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!dt)return;const x=r[document.getElementById('horizontal').value]||0,y=-(r[document.getElementById('vertical').value]||0);const dx=Math.abs(x)>1.2?x*dt*Number(document.getElementById('gain').value):0,dy=Math.abs(y)>1.2?y*dt*Number(document.getElementById('gain').value):0;if(!dx&&!dy)return;if(pending){pending.dx+=dx;pending.dy+=dy}else pending={kind:'gyro',dx,dy};flush();});
document.addEventListener('visibilitychange',()=>{last=0;pending=null;if(document.hidden)finishDrag();});let dragging=false;function finishDrag(){if(dragging){dragging=false;send({kind:'drag',active:false,dx:0,dy:0});}}setInterval(()=>{if(dragging)send({kind:'drag',active:true,dx:0,dy:0});},200);
const pad=document.getElementById('pad');function center(ts){return Array.from(ts).reduce((a,t)=>({x:a.x+t.clientX/ts.length,y:a.y+t.clientY/ts.length}),{x:0,y:0});}
pad.addEventListener('touchstart',e=>{e.preventDefault();if(!start){start=center(e.touches);moved=false;count=0;}count=Math.max(count,e.touches.length);prev=center(e.touches);if(e.touches.length===2)spread=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:false});pad.addEventListener('touchmove',e=>{e.preventDefault();const p=center(e.touches);if(Math.hypot(p.x-start.x,p.y-start.y)>10)moved=true;if(e.touches.length===3&&prev&&moved){dragging=true;send({kind:'drag',active:true,dx:p.x-prev.x,dy:p.y-prev.y});}if(e.touches.length===1&&count===1&&prev&&!active)send({kind:'touch',dx:p.x-prev.x,dy:p.y-prev.y});if(e.touches.length===2&&count===2&&prev){const distance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(Math.abs(distance-spread)>24){send({kind:'button',button:distance>spread?'motion_zoom_in':'motion_zoom_out'});spread=distance;}else send({kind:'scroll',dx:p.x-prev.x,dy:p.y-prev.y});}prev=p;},{passive:false});pad.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length<3)finishDrag();if(e.touches.length){prev=center(e.touches);return;}if(moved&&count>=4&&start&&prev){const x=prev.x-start.x,y=prev.y-start.y;send({kind:'button',button:Math.abs(x)>Math.abs(y)?(x>0?'motion_right':'motion_left'):(y>0?'motion_down':'motion_up')});}if(!moved)send({kind:'button',button:count===1?'select':count===2?'two_finger_tap':count===3?'three_finger_tap':'four_finger_tap'});start=prev=null;},{passive:false});pad.addEventListener('touchcancel',()=>{finishDrag();start=prev=null;count=0;});
</script></html>
